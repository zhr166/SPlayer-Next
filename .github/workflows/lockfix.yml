name: Lockfile Repair

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 12.15.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Repair lockfile
        run: pnpm install --no-frozen-lockfile --ignore-scripts --lockfile-only

      - name: Verify frozen lockfile
        run: pnpm install --frozen-lockfile --ignore-scripts --lockfile-only

      - uses: actions/upload-artifact@v4
        with:
          name: pnpm-lock
          path: pnpm-lock.yaml
